name: Eco-Critical UI

on:
  push:
    branches: ["codex/eco-critical-source", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-critical-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classroom-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CLASSROOM_QA_BROWSER: chromium
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Lint classroom frontend
        working-directory: frontend
        run: npm run lint:classroom
      - name: Run classroom regression tests
        run: node --test tests/classroom/*.test.mjs
      - name: Build server client
        working-directory: frontend
        run: npm run build
        env:
          CLASSROOM_BUILD_SECRET_CANARY: eco_build_secret_must_not_ship_7f2b
      - name: Build static client demo
        working-directory: frontend
        run: npm run build:demo
        env:
          CLASSROOM_BUILD_SECRET_CANARY: eco_build_secret_must_not_ship_7f2b
      - name: Check both bundles for server environment leakage
        run: |
          node scripts/check-client-secrets.mjs frontend/dist
          node scripts/check-client-secrets.mjs frontend/dist-demo
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Test compiled app and capture desktop and mobile
        run: node scripts/run-classroom-qa.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eco-critical-ui-${{ github.run_id }}
          path: artifacts/classroom/
          if-no-files-found: warn
          retention-days: 14
